name: Deploy AWS Glue Job

on:
  push:
    branches:
      - main
    paths:
      - glue_jobs/**

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.10

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Zip Glue script
      run: |
        mkdir -p build
        cp ${{ secrets.SCRIPT_PATH }} build/job.py
        cd build && zip job.zip job.py

    - name: Upload to S3
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_REGION: ${{ secrets.AWS_REGION }}
      run: |
        aws s3 cp build/job.zip s3://${{ secrets.S3_BUCKET }}/scripts/job.zip

    - name: Update AWS Glue Job
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_REGION: ${{ secrets.AWS_REGION }}
      run: |
        aws glue update-job \
          --job-name ${{ secrets.GLUE_JOB_NAME }} \
          --job-update '{
            "Command": {
              "Name": "glueetl",
              "ScriptLocation": "s3://${{ secrets.S3_BUCKET }}/scripts/job.zip",
              "PythonVersion": "3"
            },
            "MaxRetries": 0,
            "Timeout": 10
          }'
